[package]
name = "lark-bot-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
agent-client-protocol = { version = "=3.2.0", features = ["process"] }
base64 = "=0.22.1"
larksuite-oapi-sdk-rs = { version = "0.3.12", features = ["ws", "axum"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "=2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tokio-util = "=0.7.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "=1.27.0", features = ["v4"] }

# 仅供集成测试使用的假 ACP agent（见 tests/acp_integration.rs）。
[[bin]]
name = "fake_agent"
path = "tests/support/fake_agent.rs"
test = false
doc = false
