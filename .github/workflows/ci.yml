name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  clippy:
    name: cargo clippy
    runs-on: novita-scale-set
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # protoc: larksuite-oapi-sdk-rs (ws feature) runs prost-build at compile time.
      - name: Install C toolchain and protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev zstd protobuf-compiler
          protoc --version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
